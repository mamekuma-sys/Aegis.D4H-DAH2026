# 스켈레톤 Compose override — 팀 공격 이미지만 교체한다.
#
# 공식 스켈레톤 파일을 수정·복사하지 않고, team1-attacker의 빌드 컨텍스트만 팀 저장소의
# 공격 패키지로 교체한다. TARGETS·PORTS·SUBMIT_URL·SUBMIT_TOKEN·LLM_* 등 환경변수는
# 스켈레톤 base compose가 주입하는 값을 그대로 병합해 쓴다(하드코딩 금지).
#
# 여러 Compose 파일을 -f 로 병합하면 상대경로는 override 파일이 아니라 첫 번째 -f 파일
# (공식 스켈레톤 deploy/docker-compose.yml) 기준으로 해석된다. 따라서 context 에
# ../agents/attacker 를 쓰면 <스켈레톤-루트>/agents/attacker 를 가리켜 실패한다.
# 저장소 절대경로는 AEGIS_ATTACKER_CONTEXT 로 주입한다. 개인 경로는 Git에 기록하지 않는다.
#
# 실행은 integration/run-with-skeleton.ps1 을 사용한다.

services:
  team1-attacker:
    build:
      context: "${AEGIS_ATTACKER_CONTEXT:?AEGIS_ATTACKER_CONTEXT must point to repo agents/attacker}"
    image: aegis/attacker:latest
