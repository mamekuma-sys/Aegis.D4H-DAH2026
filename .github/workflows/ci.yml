name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate portable repository entrypoints
        run: bash scripts/tests/test-shell-entrypoints.sh

  repository-foundation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository layout
        shell: pwsh
        run: ./scripts/check-layout.ps1

      - name: Test external skeleton validator
        shell: pwsh
        run: ./scripts/tests/test-validate-skeleton.ps1

      - name: Test attacker and defender Compose override contract
        shell: pwsh
        run: ./scripts/tests/test-compose-agents-override.ps1

  defender-tests:
    # 방어 런타임은 python:3.12-slim 컨테이너에서 동작하므로, 병합 게이트도 같은
    # 플랫폼·버전에서 돌린다. 표준 라이브러리만 쓰므로 설치 단계가 없다.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run defender unit and contract tests
        working-directory: agents/defender
        run: python -m unittest discover -s tests -t . -v

  attacker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run attacker unit and contract tests
        working-directory: agents/attacker
        run: python -m unittest discover -s tests -t . -v

  linux-amd64-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test the immutable image build contract
        run: bash scripts/tests/test-build-images.sh

      - name: Build and inspect both linux/amd64 images
        run: bash scripts/build-images.sh
